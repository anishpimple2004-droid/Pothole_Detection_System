<!-- login_contractor.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contractor Login</title>
  <link rel="stylesheet" href="/static/css/style7.css">
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <!-- Corner decorations -->
  <div class="corner-decoration top-left"></div>
  <div class="corner-decoration top-right"></div>

  <div class="login-container">
    <div class="login-box">
      <!-- Avatar container -->
      <div class="avatar-container">
        <div class="avatar contractor-avatar"></div>
      </div>
      
      <h2>CONTRACTOR LOGIN</h2>
      <p class="subtitle">Enter your credentials to continue</p>
      
      <form method="POST" action="/login/contractor">
        <div class="input-group">
          <input type="email" name="email" placeholder="Email" required/>
        </div>
        <div class="input-group">
          <input type="password" name="password" placeholder="Password" required/>
        </div>
        <button type="submit" class="contractor-btn">LOGIN</button>
        <p class="form-footer">If you're a new user, then <a href="/signup/contractor">Sign up</a></p>
      </form>
    </div>
  </div>

  <!-- City skyline and road -->
  <div class="city-skyline"></div>
  <div class="road-container">
    <div class="road">
      <div class="lane-markings"></div>
      <div class="cars" id="cars-container"></div>
    </div>
  </div>

  <script>
    // Flash message timeout
    setTimeout(() => {
      document.querySelectorAll('.flash').forEach(el => {
        el.style.transition = "opacity 0.5s ease";
        el.style.opacity = "0";
        setTimeout(() => el.remove(), 500);
      });
    }, 4000);
  </script>
  <script src="/static/js/signup.js"></script>
</body>
</html>
