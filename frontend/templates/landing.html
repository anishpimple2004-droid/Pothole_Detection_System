<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pothole Detection System</title>
    <style>
        
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }
  
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background-color: #f0f2f5;
    position: relative;
    overflow-x: hidden;
    overflow-y: auto;
  }
  
  /* Login container with proper spacing */
  .login-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 180PX;
    flex: 1;
    z-index: 10;
    margin-bottom: 150px;
  }
  
  .login-box {
    background-color: white;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 400px;
    text-align: center;
    position: relative;
  }
  
  /* Avatar styling */
  .avatar-container {
    display: flex;
    justify-content: center;
    margin-top: -70px;
    margin-bottom: 20px;
    position: relative;
    z-index: 10;
  }
  
  .avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background-color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    border: 3px solid white;
  }
  
  /* Admin avatar - black silhouette */
  .admin-avatar:after {
    content: "";
    display: block;
    width: 30px;
    height: 40px;
    background-color: #000;
    border-radius: 50% 50% 0 0;
  }
  
  /* User avatar - green silhouette */
  .user-avatar:after {
    content: "";
    display: block;
    width: 30px;
    height: 40px;
    background-color: #4CAF50;
    border-radius: 50% 50% 0 0;
  }
  
  /* Text styles */
  h2 {
    font-size: 24px;
    margin-bottom: 5px;
    color: #333;
    font-weight: bold;
  }
  
  .subtitle {
    color: #666;
    margin-bottom: 25px;
    font-size: 14px;
  }
  
  /* Button styling */
  .login-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
  }
  
  .login-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 4px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }
  
  .admin-btn {
    background-color: #3b5998;
  }
  
  .admin-btn:hover {
    background-color: #324b81;
  }
  
  .user-btn {
    background-color: #4CAF50;
  }
  
  .user-btn:hover {
    background-color: #45a049;
  }
  
  .contractor-btn {
    background-color: #FF9800;
  }
  
  .contractor-btn:hover {
    background-color: #F57C00;
  }
  
  /* Corner decorations */
  .corner-decoration {
    position: absolute;
    width: 60px;
    height: 60px;
    border: 2px solid #a0c8f0;
    z-index: 5;
  }
  
  .top-left {
    top: 20px;
    left: 20px;
    border-right: none;
    border-bottom: none;
  }
  
  .top-right {
    top: 20px;
    right: 20px;
    border-left: none;
    border-bottom: none;
  }
  
  /* City skyline */
  .city-skyline {
    position: fixed;
    bottom: 50px;
    left: 0;
    width: 100%;
    height: 100px;
    background-color: #a0a0a0;
    z-index: 2;
  }
  
  .city-skyline:before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: linear-gradient(
        to right,
        #a0a0a0 0%,
        #a0a0a0 5%,
        #b0b0b0 5%,
        #b0b0b0 10%,
        #909090 10%,
        #909090 15%,
        #a0a0a0 15%,
        #a0a0a0 25%,
        #b0b0b0 25%,
        #b0b0b0 30%,
        #909090 30%,
        #909090 35%,
        transparent 35%,
        transparent 65%,
        #909090 65%,
        #909090 70%,
        #a0a0a0 70%,
        #a0a0a0 75%,
        #b0b0b0 75%,
        #b0b0b0 85%,
        #909090 85%,
        #909090 90%,
        #a0a0a0 90%,
        #a0a0a0 100%
    );
    background-size: 100% 100%;
    clip-path: polygon(
        0% 100%,
        0% 40%,
        5% 70%,
        10% 45%,
        15% 70%,
        20% 40%,
        25% 60%,
        30% 35%,
        35% 60%,
        40% 45%,
        45% 65%,
        50% 30%,
        55% 55%,
        60% 40%,
        65% 60%,
        70% 35%,
        75% 65%,
        80% 40%,
        85% 55%,
        90% 30%,
        95% 60%,
        100% 45%,
        100% 100%
    );
  }
  
  /* Road and cars */
  .road-container {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 50px;
    z-index: 3;
  }
  
  .road {
    width: 100%;
    height: 100%;
    background-color: #333;
    position: relative;
  }
  
  .lane-markings {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 4px;
    background: repeating-linear-gradient(
        to right,
        transparent,
        transparent 20px,
        white 20px,
        white 40px
    );
  }
  
  .cars {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  
  .car {
    position: absolute;
    width: 40px;
    height: 20px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    border-radius: 5px;
    top: 10px;
  }
  /* Lane A - top lane (opposite side) */
.car.lane-a {
  top: 10px; /* above the dashed line */
}

/* Lane B - bottom lane (default direction) */
.car.lane-b {
  top: 25px; /* below the dashed line */
}

  
  .red-car {
    background-color: #ff5252;
    animation: driveLeft 15s linear infinite;
    right: -50px;
  }
  
  .blue-car {
    background-color: #2196F3;
    animation: driveRight 12s linear infinite;
    left: -50px;
  }
  
  .green-car {
    background-color: #4CAF50;
    animation: driveRight 20s linear infinite;
    left: -50px;
  }
  
  .yellow-car {
    background-color: #FFC107;
    animation: driveLeft 17s linear infinite;
    right: -50px;
  }
  
  /* Car animations */
  @keyframes driveRight {
    from { left: -50px; }
    to { left: calc(100% + 50px); }
  }
  
  @keyframes driveLeft {
    from { right: -50px; }
    to { right: calc(100% + 50px); }
  }
  
  .drop-container {
  display: flex;
  justify-content: center;  /* center horizontally */
  align-items: center;      /* center vertically */
  height: 10vh;            /* full screen height or adjust as needed */
  background-color: white; /* optional, just like your screenshot */
}

.drop-icon {
  width: 30px;
  height: 45px;
  position: relative;
}

.drop-icon::before {
  content: "";
  position: absolute;
  width: 30px;
  height: 30px;
  background-color: black;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  top: 7.5px; /* optional: centers the point */
  left: 0;
}

  
  /* Fixed positioning for small screens */
  @media (max-height: 700px) {
    .login-container {
      padding-top: 40px;
    }
  }
  
  /* Mobile responsiveness */
  @media (max-width: 600px) {
    .login-box {
      width: 90%;
      padding: 20px;
    }
    
    .corner-decoration {
      width: 40px;
      height: 40px;
    }
    
    .avatar-container {
      margin-top: -50px;
    }
  }
    </style>
</head>
<body>
    <!-- Corner decorations -->
    <div class="corner-decoration top-left"></div>
    <div class="corner-decoration top-right"></div>
    
    <!-- Main login container -->
    <div class="login-container">
        <div class="login-box">
            <!-- Water drop icon for pothole -->
            <div class="avatar-container">
                <div class="avatar">
                    <div class="drop-container">
                        <div class="drop-icon"></div>
                      </div>                      
                </div>
            </div>
            
            <h2>Pothole Detection System</h2>
            <p class="subtitle">Please select your login type</p>
            
            <div class="login-options">
                <a href="/login/admin" class="login-btn admin-btn">ADMIN</a>
                <a href="/login/user" class="login-btn user-btn">USER</a>
                <a href="/login/contractor" class="login-btn contractor-btn">CONTRACTOR</a>
            </div>
        </div>
    </div>
    
    <!-- City skyline -->
    <div class="city-skyline"></div>
    
    <!-- Road with cars -->
    <div class="road-container">
        <div class="road">
            <div class="lane-markings"></div>
            <div class="cars">
                <div class="car red-car lane-b"></div>
                <div class="car blue-car lane-a" style="animation-delay: -5s;"></div>
                <div class="car yellow-car lane-b" style="animation-delay: -8s;"></div>
                <div class="car green-car lane-a" style="animation-delay: -15s;"></div>
            </div>
        </div>
    </div>

    <script>
        // Add more cars dynamically
        document.addEventListener('DOMContentLoaded', function() {
            const carColors = ['red-car', 'blue-car', 'green-car', 'yellow-car'];
            const carsContainer = document.querySelector('.cars');
            
            // Add some additional cars with different delays
            for (let i = 0; i < 4; i++) {
                const car = document.createElement('div');
                car.className = `car ${carColors[i % carColors.length]}`;
                
                // Randomize animation delay
                const delay = Math.random() * -20;
                car.style.animationDelay = `${delay}s`;
                
                carsContainer.appendChild(car);
            }
        });
    </script>
</body>
</html>
